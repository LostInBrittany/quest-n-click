# Node and the repository's dependencies, for every job that runs `npm ci` (#524): setup-node with the npm cache, then
# `npm ci` through scripts/npm-install.mjs (#539): tried again on a registry hiccup only (a 404 on a tarball, ETARGET,
# the network, a 5xx or a 429, scripts/lib/archive-harness.mjs `transientNpm`) or an attempt over its time limit, four
# times at most, 30, 60 then 120 s apart. One `timeout-minutes` on the step alone let an attempt that stalls spend the
# whole step (#338): each attempt has its own limit, the `timeout` input, and the calling step keeps a `timeout-minutes`
# with room for the four and the three pauses (tests/ci-retry.test.ts). Not on Windows: npm runs there through cmd.exe,
# and the limit would kill cmd.exe, not npm; the step's limit holds.
# The calling job checks the repository out first: a local action is read from the checkout.
name: Node and npm ci
description: setup-node with the npm cache, then npm ci tried again on a registry hiccup, each attempt bounded.
inputs:
  node-version:
    description: The Node version setup-node installs.
    default: '22'
  timeout:
    description: Minutes an attempt of npm ci may take, off Windows; 0 leaves it unbounded.
    default: '3'
  safe-directory:
    description: >-
      true in a container job: the checkout belongs to the runner's user, not root, and git is told it is safe.
    default: 'false'
runs:
  using: composite
  steps:
    # `$(pwd)`, the step's directory, is the workspace as the container mounts it (`/__w/…`); `github.workspace` is the
    # host's path.
    - if: inputs.safe-directory == 'true'
      shell: bash
      run: git config --global --add safe.directory "$(pwd)"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - shell: bash
      env:
        NPM_TRY_MINUTES: ${{ runner.os != 'Windows' && inputs.timeout || '0' }}
      run: node scripts/npm-install.mjs ci
