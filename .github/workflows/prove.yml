name: prove
# The exhaustive proof and the bench, weekly and on demand: too slow for every push on a big game, never a gate.
on:
  schedule:
    # Sunday evening (#372): GitHub starts it 5.5 to 8 hours late, in Monday's night; tools/schedule-guard.ts.
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      game:
        description: 'GAME to prove (games/<id>)'
        default: demo
      rooms:
        description: 'Stress game size for the bench'
        default: '100'
permissions:
  contents: read
jobs:
  # The working-day guard (4.5.6, #372): GitHub starts this schedule hours late (5 h 37 min to 7 h 40 min in October
  # 2026), so the cron is Sunday evening (20:00 UTC) and lands it in Monday's night; a scheduled run that still starts
  # in the Paris working day (07:00 to 20:00 Paris time) skips its job and stays green. A run by hand always runs
  # (tools/schedule-guard.ts, tests/schedule-guard.test.ts). Node alone, no `npm ci`.
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: guard
        env:
          EVENT: ${{ github.event_name }}
        run: node --experimental-strip-types --no-warnings tools/schedule-guard.ts --event="$EVENT"
  prove:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (timeout 3m npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 10
      - run: npm run prove:game
      # The committed playtests must still replay on this content: a diverged one fails here, not on every push.
      - run: npm run playtests -- --strict
        env:
          GAME: ${{ github.event.inputs.game || 'demo' }}
      # The exhaustive proof has no reduction: on a 40-room chain it is truncated at 50 000 states after seven minutes
      # (wiki/en/contribute.benchmarks.md). The bench proves within a budget and reports `truncated` honestly.
      - shell: bash
        run: npm run bench -- --rooms=${{ github.event.inputs.rooms || '100' }} --players=5 --items=120 --flags=300 --npcs=10 --scripts=30 --topics=100 --max=20000 --prove --v3 | tee bench.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: bench.md
