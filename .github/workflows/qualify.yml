name: qualify
# The Bridge's qualification profile (4.1.18, ops/qualify): `npm run ops:qualify` on a runner with Docker, whenever the
# profile, the tool or the Bridge changes on a pull request, or by hand. The candidate runs the same smoke on its own
# packages (candidate.yml `deployment-smoke`); this is the loop that keeps the profile working between candidates.
on:
  pull_request:
    paths:
      - 'ops/**'
      - 'scripts/ops-qualify.mjs'
      - 'scripts/ops-qualify/**'
      - 'scripts/pack.mjs'
      - 'bridge/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/ops-qualify.test.ts'
      - '.github/workflows/qualify.yml'
  # On main too: the profile does not rot between candidates.
  push:
    branches: [main]
    paths:
      - 'ops/**'
      - 'scripts/ops-qualify.mjs'
      - 'scripts/ops-qualify/**'
      - 'scripts/pack.mjs'
      - 'bridge/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/ops-qualify.test.ts'
      - '.github/workflows/qualify.yml'
  workflow_dispatch: {}
permissions:
  contents: read
# A newer push cancels the run it supersedes, on a pull request and on main (4.5.5, #345): no release step reads
# qualify's main run (the release reads the candidate's qualification), and the latest main run is enough to keep the
# profile from rotting. A run started by hand has a group of its own and cancels nothing.
concurrency:
  group: qualify-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && '-by-hand' || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job's token never in .git/config (4.1.19): nothing the Bridges or the worker could read.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (timeout 6m npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: npm run ops:qualify -- --out=qualify
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ops-qualify
          path: qualify
          if-no-files-found: ignore
          overwrite: true
